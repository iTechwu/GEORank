# ============================================
# GEOrank — Docker 容器编排
# ============================================

services:

  # ---------- 1. 反向代理 / API Gateway ----------
  traefik:
    image: traefik:v3.7.10@sha256:9c3b91d5fb7770853ca5c1124a23c34bf2d9b47ffaebeab2614cbaf410dcb2ac
    restart: always
    ports:
      - "${GEORANK_HTTP_PORT:-80}:80"
      - "${GEORANK_HTTPS_PORT:-443}:443"
    volumes:
      - ./infra/traefik:/etc/traefik:ro
      - traefik_acme:/var/lib/traefik
    networks:
      - georank-net

  # ---------- 2. 前端静态服务 ----------
  frontend:
    image: nginx:1.31.3-alpine@sha256:4a73073bd557c65b759505da037898b61f1be6cbcc3c2c3aeac22d2a470c1752
    restart: always
    volumes:
      - ./dist:/usr/share/nginx/html:ro
      - ./runtime/homepages/public:/usr/share/nginx/custom_homepage:ro
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
    networks:
      - georank-net
      - common_network

  # ---------- 3. 数据库迁移（唯一 schema owner） ----------
  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: "no"
    command: ["python", "-m", "app.scripts.migrate"]
    environment:
      DEBUG: "false"
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-georank}
      POSTGRES_USER: ${POSTGRES_USER:-georank}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?replace-me-postgres-password}
    volumes:
      - ./backend:/app
    # 依赖集中式 dofe-postgres（外部 common_network）
    networks:
      - georank-net
      - common_network

  # ---------- 4. 核心 API 服务 (FastAPI) ----------
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    env_file: ${GEORANK_ENV_FILE:-.env}
    volumes:
      - ./backend:/app
      - ./runtime/homepages:/app/runtime/homepages
    depends_on:
      migrate:
        condition: service_completed_successfully
      qdrant:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=3).read()"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - georank-net

  # ---------- 5. Celery Worker (异步任务) ----------
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    command: celery -A app.core.celery_app worker -l info -c 4 -Q process,diagnose
    env_file: ${GEORANK_ENV_FILE:-.env}
    volumes:
      - ./backend:/app
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - georank-net
      - common_network

  # ---------- 6. Celery Beat (定时任务调度) ----------
  beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    command: celery -A app.core.celery_app beat -l info
    env_file: ${GEORANK_ENV_FILE:-.env}
    volumes:
      - ./backend:/app
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - georank-net
      - common_network

  # ---------- 9. Qdrant 向量数据库 ----------
  qdrant:
    image: qdrant/qdrant:v1.12.1@sha256:d774e7bb65744454984c6021637a0da89271f30df15e48601a9fafc926d26b1f
    restart: always
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      QDRANT__SERVICE__GRPC_PORT: 6334
    networks:
      - georank-net

  # ---------- 10. Playwright 爬虫沙箱 ----------
  crawler:
    build:
      context: ./backend
      dockerfile: Dockerfile.crawler
    restart: always
    command: celery -A app.core.celery_app worker -l info -c 2 -Q crawl --hostname=crawler@%h
    env_file: ${GEORANK_ENV_FILE:-.env}
    volumes:
      - ./backend:/app
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - georank-net
      - common_network

volumes:
  traefik_acme:
  qdrant_data:

networks:
  georank-net:
    driver: bridge
  # dofe 部署外部共享网络：用于解析集中式 dofe-postgres / dofe-redis
  common_network:
    external: true
    name: common_network
