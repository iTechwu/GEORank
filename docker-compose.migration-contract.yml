# CI-only override layered onto docker-compose.yml. The disposable PostgreSQL
# and Redis services below are test fixtures, not deployment infrastructure.
services:
  traefik:
    ports: !override
      - "127.0.0.1:0:80"
    volumes: !override
      - ./infra/traefik:/etc/traefik:ro

  frontend:
    ports: !override
      - "127.0.0.1:0:80"

  postgres:
    image: postgres:16.9-alpine@sha256:7c688148e5e156d0e86df7ba8ae5a05a2386aaec1e2ad8e6d11bdf10504b1fb7
    environment:
      POSTGRES_DB: georank_contract
      POSTGRES_USER: georank
      POSTGRES_PASSWORD: test-contract-password
    ports: !reset []
    volumes: !reset []
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U georank -d georank_contract"]
      interval: 2s
      timeout: 2s
      retries: 30
    networks:
      - georank-net

  redis:
    image: redis:7.4.2-alpine@sha256:024b7e314b21667d46452e2c9d099d27b4a08c8e9f2e337b30d86dffd0c3cbcf
    ports: !reset []
    volumes: !reset []
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30
    networks:
      - georank-net

  migrate:
    environment:
      DEBUG: "false"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: georank_contract
      POSTGRES_USER: georank
      POSTGRES_PASSWORD: test-contract-password
    volumes: !reset []
    depends_on:
      postgres:
        condition: service_healthy

  api:
    env_file: !reset []
    environment:
      DEBUG: "false"
      SECRET_KEY: test-contract-secret-key-32-characters-minimum
      SETTINGS_ENCRYPTION_KEY: test-contract-settings-key-32-characters-minimum
      JWT_SECRET: test-contract-jwt-key-32-characters-minimum
      PUBLIC_BASE_URL: https://contract.georank.test
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: georank_contract
      POSTGRES_USER: georank
      POSTGRES_PASSWORD: test-contract-password
      REDIS_HOST: redis
      QDRANT_HOST: dofe-qdrant
      NEO4J_URI: bolt://dofe-neo4j:7687
      NEO4J_PASSWORD: test-contract-neo4j-password
    ports: !reset []
    volumes: !reset []
    labels: !reset []
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
