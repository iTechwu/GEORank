# CI/runtime override layered onto docker-compose.yml. It keeps the production
# service graph, publishes gateway probes on ephemeral loopback ports, and
# removes persistent volumes and secret env files.
services:
  traefik:
    ports: !override
      - "127.0.0.1:0:80"
    volumes: !override
      - ./infra/traefik:/etc/traefik:ro

  frontend:
    ports: !override
      - "127.0.0.1:0:80"

  migrate:
    environment:
      DEBUG: "false"
      POSTGRES_HOST: ${MIGRATION_CONTRACT_POSTGRES_HOST:-host.docker.internal}
      POSTGRES_PORT: "5432"
      POSTGRES_DB: georank_contract
      POSTGRES_USER: georank
      POSTGRES_PASSWORD: test-contract-password
    volumes: !reset []
    extra_hosts:
      - "host.docker.internal:host-gateway"

  api:
    env_file: !reset []
    environment:
      DEBUG: "false"
      SECRET_KEY: test-contract-secret-key-32-characters-minimum
      SETTINGS_ENCRYPTION_KEY: test-contract-settings-key-32-characters-minimum
      JWT_SECRET: test-contract-jwt-key-32-characters-minimum
      PUBLIC_BASE_URL: https://contract.georank.test
      POSTGRES_HOST: ${MIGRATION_CONTRACT_POSTGRES_HOST:-host.docker.internal}
      POSTGRES_PORT: "5432"
      POSTGRES_DB: georank_contract
      POSTGRES_USER: georank
      POSTGRES_PASSWORD: test-contract-password
      REDIS_HOST: ${MIGRATION_CONTRACT_REDIS_HOST:-host.docker.internal}
    ports: !reset []
    volumes: !reset []
    labels: !reset []
    extra_hosts:
      - "host.docker.internal:host-gateway"
